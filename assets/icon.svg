<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    Chrome Web Store 图标规范：
    - 画布 128x128，实际图形 96x96，每边 16px 透明内边距
    - 主体偏深，加一圈微弱白色光晕以便深色背景下有轮廓
  -->
  <defs>
    <!-- 深色背景下的微白光晕（sips 渲染兼容的多层描边模拟） -->
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="blur"/>
      <feOffset in="blur" dx="0" dy="0" result="offsetBlur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.18" result="glowColor"/>
      <feComposite in="glowColor" in2="offsetBlur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#halo)">
    <!-- 黑色圆角底，96x96 居中，代表 X 平台 -->
    <rect x="16" y="16" width="96" height="96" rx="22" fill="#000000"/>

    <!-- 白色 X 官方字形（24x24 路径），放大到约 56px 居中 -->
    <g transform="translate(36,36) scale(2.333)">
      <path fill="#ffffff" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
    </g>

    <!-- 红色禁止圈，直径约 84px（半径 42），在 96 内容区内 -->
    <circle cx="64" cy="64" r="42" fill="none" stroke="#f4212e" stroke-width="6.5"/>

    <!-- 红色斜杠，沿圆的 45 度角 -->
    <line x1="34.3" y1="93.7" x2="93.7" y2="34.3" stroke="#f4212e" stroke-width="6.5" stroke-linecap="round"/>
  </g>
</svg>
